name: PR - Parse & Test

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      DBT_PROFILES_DIR: ./.ci/profiles

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python regression tests
        run: python -m unittest discover -s tests

      # The demo profile supplies demo_* env_var fallbacks, so deps and parse
      # need no Snowflake secrets. This project is retired: there is no live
      # account to compile/test/freshness-check against, so CI validates that
      # the dbt project still parses and the app logic still passes its tests.
      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        run: dbt parse
